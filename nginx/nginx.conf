# =============================================================================
# nginx ana yapılandırması — Medipol Envanter (statik ESM ön yüz)
#
# [WHY]: ESM modülleri application/javascript MIME türü ister; tarayıcılar yanlış türdeki <script type="module"> içe
#        aktarımlarını çalıştırmaz. Faz 4 · J5 (SEC-03): eski tek dosyada (1) engeller regex sırasında statik varlık kuralının
#        ARKASINDA kalıyordu — /backup/x.js gibi bir istek engele hiç ulaşmadan servis ediliyordu; (2) güvenlik başlıkları yalnız
#        server düzeyindeydi, kendi add_header'ı olan her location bunları sessizce düşürüyordu; (3) hash'siz JS/CSS bir yıl
#        "immutable" önbellekteydi (yeni sürüm tarayıcıya ulaşmıyordu); (4) 50x.html yoktu.
# [HOW]: Site tanımı sites/*.conf; tüm konumlar snippets/site.inc'te; başlıklar tek include'dan (her location'da). CSP, imaj
#        açılışında templates/ → generated/ olarak üretilir (CSP_CONNECT_EXTRA: yalnız yerel emülatörle geliştirme için).
#        Politikanın kaynağı firebase.json; smoke testi iki kopyanın aynı olduğunu denetler (scratch/csp.js).
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;

    # Uygulamanın sunduğu türlerin TAM listesi (mime.types içe aktarılmaz: aynı uzantıları iki kez tanımlamak uyarı üretir).
    # ES modülleri için application/javascript (bazı mime.types sürümleri text/javascript kullanır).
    types {
        application/javascript  js mjs;
        text/css                css;
        text/html               html htm;
        image/svg+xml           svg svgz;
        image/png               png;
        image/jpeg              jpg jpeg;
        image/gif               gif;
        image/webp              webp;
        image/x-icon            ico;
        application/json        json;
        font/woff               woff;
        font/woff2              woff2;
        font/ttf                ttf;
        application/vnd.ms-fontobject  eot;
        application/pdf         pdf;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;          # sürüm bilgisi yanıtlarda görünmez

    # HSTS yalnız TLS üzerinden sunulurken (tls.conf); düz HTTP'de boş değer → başlık gönderilmez
    map $scheme $hsts_header {
        https    "max-age=31536000; includeSubDomains";
        default  "";
    }

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    include /etc/nginx/sites/*.conf;
}
