# =============================================================================
# [WHY]: ESM modules require application/javascript MIME type. Without this,
#         browsers with strict MIME checking (all modern ones) will refuse to
#         execute <script type="module"> imports, causing a total app crash.
# [HOW]: We override the default nginx MIME mapping for .js files, add
#         aggressive caching for static assets, enable gzip compression for
#         performance, and add a try_files fallback for future SPA routing.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # CRITICAL: Explicitly declare .js MIME type as application/javascript.
    # The default nginx mime.types uses text/javascript in some versions, but
    # the WHATWG spec mandates application/javascript for ES Modules.
    # -------------------------------------------------------------------------
    types {
        application/javascript  js mjs;
        text/css                css;
        text/html               html htm;
        image/svg+xml           svg svgz;
        image/png               png;
        image/jpeg              jpg jpeg;
        image/gif               gif;
        image/webp              webp;
        image/x-icon            ico;
        application/json        json;
        font/woff               woff;
        font/woff2              woff2;
        application/pdf         pdf;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # -------------------------------------------------------------------------
    # Gzip Compression -- reduces bandwidth for JS/CSS assets significantly
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # ---------------------------------------------------------------------
        # Security Headers
        # ---------------------------------------------------------------------
        add_header X-Frame-Options         "SAMEORIGIN"  always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ---------------------------------------------------------------------
        # SPA Fallback Routing
        # Supports potential future client-side routing (e.g., hash-based or
        # history API routes). Unknown paths fall back to index.html.
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------------------
        # Static Asset Caching -- JS, CSS, Images, Fonts
        # Cache-Control: 1 year for versioned assets, stale-while-revalidate
        # for a smooth developer experience during updates.
        # ---------------------------------------------------------------------
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
        }

        # ---------------------------------------------------------------------
        # HTML -- never cache; always fetch fresh to pick up new asset hashes
        # ---------------------------------------------------------------------
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ---------------------------------------------------------------------
        # Firebase config files & hidden dot-files -- block direct access
        # ---------------------------------------------------------------------
        location ~* (firebase\.json|firestore\.rules|\.env|\.firebaserc|\.git) {
            deny all;
            return 404;
        }

        # Block node_modules and backup directories from being served
        location ~* ^/(node_modules|backup|\.firebase|\.agents|\.kilo|\.lingma|functions)/ {
            deny all;
            return 404;
        }

        # ---------------------------------------------------------------------
        # Custom error pages
        # ---------------------------------------------------------------------
        error_page  404  /404.html;
        location = /404.html {
            internal;
        }

        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root  /usr/share/nginx/html;
            internal;
        }
    }
}
