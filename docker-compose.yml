# =============================================================================
# Antigravity Frontend — Docker Compose (v3.1 ESM Frontend)
#
# [WHY]: docker-compose.yml provides a declarative, reproducible way to run
#         the container without memorizing long `docker run` commands.
# [HOW]: Defines one service (antigravity-frontend), maps host:8080 to
#         container:80, enforces restart policy, and attaches named volumes
#         for Nginx logs so they are visible from the host.
# =============================================================================

services:
  antigravity-frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: antigravity-frontend

    # Map host port 8080 → container port 80
    # Access the app at: http://localhost:8080
    ports:
      - "8080:80"

    # Automatically restart the container unless it was manually stopped
    restart: unless-stopped

    # Named volume for Nginx logs — persists logs across container restarts
    # and makes them inspectable from the host at ./logs/nginx/
    volumes:
      - nginx_logs:/var/log/nginx

    # Health check: ensures the container is actually serving requests
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    labels:
      - "com.antigravity.service=frontend"
      - "com.antigravity.version=3.1"
      - "com.antigravity.env=production"

volumes:
  nginx_logs:
    driver: local
