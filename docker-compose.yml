# =============================================================================
# Medipol Envanter — Docker Compose (kılavuz: DOCKER_GUIDE.md)
#
# [WHY]: Faz 4 · J5 — host portu 8080'di; Firestore emülatörüyle (8080) çakışıyordu. Sağlık kontrolü "localhost"u IPv6'ya
#        çözebiliyordu (nginx yalnız IPv4 dinler).
# [HOW]: Host portu HOST_PORT ile (varsayılan 8088). CSP_CONNECT_EXTRA yalnız yerel emülatörle geliştirmede doldurulur.
# DİKKAT: Uygulama veritabanı kökünü ALAN ADINA göre seçer: localhost / 127.0.0.1 / "demo" içeren ad → inventory_demo,
#         diğer her ad (sunucu IP'si dahil) → CANLI kök lifeserver_master. Bkz. DOCKER_GUIDE.md §0.
# =============================================================================

services:
  envanter:
    build:
      context: .
      dockerfile: Dockerfile
    image: medipol-envanter:${IMAGE_TAG:-local}
    container_name: medipol-envanter
    ports:
      - "${HOST_PORT:-8088}:80"
    environment:
      CSP_CONNECT_EXTRA: "${CSP_CONNECT_EXTRA:-}"
    restart: unless-stopped
    volumes:
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nginx_logs:
    driver: local
